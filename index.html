<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mirror Caption Studio</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<h1>Mirror Caption Studio</h1>

</header>



<div class="studio">


<!-- CONTROL PANEL -->

<div class="controls">


<h2>PHOTO</h2>

<input 
type="file"
id="imageInput"
accept="image/*">


<button id="mirrorBtn">
Create Mirror
</button>



<hr>



<h2>CAPTION 1</h2>


<textarea
id="captionOne"
placeholder="Write first caption...">
</textarea>



<h2>CAPTION 2</h2>


<textarea
id="captionTwo"
placeholder="Write mirror caption...">
</textarea>



<hr>


<h2>SETTINGS</h2>


<label>
Caption Size
</label>

<input 
type="range"
id="captionSize"
min="20"
max="100"
value="50">



<label>
Mirror Opacity
</label>

<input 
type="range"
id="mirrorOpacity"
min="0"
max="100"
value="80">



<label>
Mirror Angle
</label>

<input 
type="range"
id="mirrorAngle"
min="0"
max="180"
value="180">



<br>


<button id="saveBtn">
Save Image
</button>


</div>





<!-- PREVIEW -->


<div class="previewArea">


<div id="canvas">


<!-- ORIGINAL PHOTO -->

<img 
id="mainImage">



<!-- MIRROR PHOTO -->

<img 
id="mirrorImage">





<!-- FIRST CAPTION -->

<div 
id="captionOnePreview">

</div>





<!-- SECOND CAPTION -->

<div 
id="captionTwoPreview">

</div>



<div id="logo">

PHATHU MBEDZI

</div>


</div>


</div>



</div>




<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script src="script.js"></script>


</body>

</html>
