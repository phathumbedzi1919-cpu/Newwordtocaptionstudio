<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caption Studio</title>

<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Caption Studio</h1>
</header>

<div class="container">

    <!-- LEFT PANEL -->
    <div class="controls">

        <h2>Background</h2>

        <input
            type="file"
            id="imageInput"
            accept="image/*">

        <button id="removeImageBtn">
            Remove Image
        </button>

        <hr>

        <h2>Caption</h2>

        <textarea
            id="captionInput"
            placeholder="Write your caption here..."
            rows="5"></textarea>

        <button id="generateWordsBtn">
            Generate Word Editor
        </button>

        <hr>

        <div id="wordEditor">

            <!-- Script will create one editor for every word -->

        </div>

        <hr>

        <h2>Font</h2>

        <select id="fontFamily">

            <option value="Arial">Arial</option>

            <option value="Georgia">Georgia</option>

            <option value="Verdana">Verdana</option>

            <option value="Tahoma">Tahoma</option>

            <option value="Impact">Impact</option>

        </select>

        <br><br>

        <label>Font Size</label>

        <input
            type="range"
            id="fontSize"
            min="20"
            max="100"
            value="48">

        <hr>

        <label>

            <input
                type="checkbox"
                id="shadowToggle"
                checked>

            Enable Shadow

        </label>

        <br><br>

        <label>Shadow Blur</label>

        <input
            type="range"
            id="shadowBlur"
            min="0"
            max="30"
            value="8">

        <br><br>

        <label>Shadow X</label>

        <input
            type="range"
            id="shadowX"
            min="-20"
            max="20"
            value="3">

        <br><br>

        <label>Shadow Y</label>

        <input
            type="range"
            id="shadowY"
            min="-20"
            max="20"
            value="3">

        <hr>

        <button id="saveBtn">
            Save PNG
        </button>

    </div>

    <!-- RIGHT PANEL -->

    <div class="previewPanel">

        <div id="canvas">

            <img
                id="backgroundImage"
                src=""
                alt="">

            <div id="captionPreview">

            </div>

            <div id="logo">

                PHATHU MBEDZI

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="script.js"></script>

</body>
  </html>
