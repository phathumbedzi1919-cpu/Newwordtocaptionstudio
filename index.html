<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Caption Studio</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<h1>Caption Studio</h1>

</header>

<div class="container">

    <!-- LEFT PANEL -->

    <aside class="controls">

        <h2>Background Image</h2>

        <input
        type="file"
        id="imageInput"
        accept="image/*">

        <hr>

        <h2>Caption</h2>

        <textarea
        id="captionInput"
        placeholder="Write your caption here..."></textarea>

        <button id="generateBtn">
            Generate Word Editor
        </button>

        <hr>

        <h2>Word Colors</h2>

        <div id="wordEditor"></div>

        <hr>

        <h2>Font</h2>

        <select id="fontFamily">

            <option value="Arial">Arial</option>

            <option value="Verdana">Verdana</option>

            <option value="Tahoma">Tahoma</option>

            <option value="Georgia">Georgia</option>

            <option value="Impact">Impact</option>

        </select>

        <br><br>

        <label>Font Size</label>

        <input
        type="range"
        id="fontSize"
        min="20"
        max="100"
        value="50">

        <br><br>

        <label>

            <input
            type="checkbox"
            id="shadowToggle"
            checked>

            Enable Shadow

        </label>

        <br><br>

        <label>Shadow Blur</label>

        <input
        type="range"
        id="shadowBlur"
        min="0"
        max="30"
        value="8">

        <br><br>

        <button id="saveBtn">

            Save PNG

        </button>

    </aside>





    <!-- PREVIEW -->



    <main class="previewArea">

        <div id="canvas">

            <img id="backgroundImage">

            <div id="captionContainer">

                <div id="captionPreview"></div>

            </div>

            <div id="logo">

                PHATHU MBEDZI

            </div>

        </div>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script src="script.js"></script>

</body>
</html>
